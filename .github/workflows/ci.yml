name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      flutter:
        description: Also verify generated projects with the pinned official Flutter SDK
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm run check

  flutter:
    name: Flutter 3.47.9
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.flutter }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      FLUTTER_REVISION: c197ca5199e9ee5661e865596c9c07294dfab51c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare pinned official Flutter source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth=1 origin refs/tags/3.47.9:refs/tags/3.47.9
          git -C "$RUNNER_TEMP/flutter" checkout --detach refs/tags/3.47.9
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Generate and verify a fresh project
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/scene-project"
          node bin/scene-tool.mjs init "$project"
          cd "$project"
          flutter pub get
          node "$GITHUB_WORKSPACE/bin/scene-tool.mjs" qa "$project/scene.json" --run
          flutter build web --release --no-pub --no-web-resources-cdn \
            --target lib/generated/qa_main.dart --output build/qa-web
